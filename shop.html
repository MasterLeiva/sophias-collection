<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tienda — Sophia's Collection</title>
  <meta name="description" content="Compra perfumes, bolsos, calzado, lentes y makeup en Sophia's Collection.">
  <meta name="theme-color" content="#fad3e5">
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=202610111151">
</head>
<body>
  <main id="main">
    <div class="container">
      <header class="page-head">
        <span class="eyebrow js-shop-eyebrow">Tienda</span>
        <h1 class="js-shop-title">Ver todo</h1>
        <p class="js-shop-desc"></p>
      </header>
      <nav class="chips js-chips" aria-label="Categorías"></nav>
      <div class="toolbar">
        <span class="js-count"></span>
        <label>
          <span class="sr-only">Ordenar por</span>
          <select class="js-sort">
            <option value="featured">Destacados</option>
            <option value="price-asc">Precio: menor a mayor</option>
            <option value="price-desc">Precio: mayor a menor</option>
            <option value="name">Nombre A–Z</option>
          </select>
        </label>
      </div>
      <div class="grid js-grid"></div>
    </div>
  </main>

  <script src="js/app.js?v=202610111151"></script>
  <script src="js/shop.js?v=202610111151"></script>
</body>
</html>
